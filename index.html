    <div class="container">
      <!-- メインスライダー -->
      <div id="main-carousel" class="splide main-carousel">
        <div class="splide__track">
          <ul class="splide__list">
            <li class="splide__slide">
              <div class="cloudimage-360" id="pot360" data-folder="https://idios-sandbox.netlify.app/pots/" data-filename-x="pot-{index}.png" data-amount-x="8" data-spin-reverse></div>
            </li>
            <li class="splide__slide"><img src="https://placehold.co/600x400?text=Slide+2" alt="Slide2"></li>
            <li class="splide__slide"><img src="https://placehold.co/600x400?text=Slide+3" alt="Slide3"></li>

    <!-- Add script tag with CDN link to js-cloudimage-360-view lib after all content in body tag -->
